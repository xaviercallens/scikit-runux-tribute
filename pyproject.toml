[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-runux-tribute"
version = "1.0.0"
description = "Public Gated Scikit-Learn Biomimetic Extension & Scientific Testimonial Tribute to Olivier Grisel"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xavier Callens", email = "licensing@socrate-ai-lab.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scikit_runux*"]
